apiVersion: v1
kind: Service
metadata:
  name: greetapp
  namespace: localdevelopment
  labels:
    app: greetapp
spec:
  type: NodePort
  selector:
    app: greetapp-rollout
  ports:
    - name: https
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: greetapp-preview
  namespace: localdevelopment
  labels:
    app: greetapp
spec:
  type: NodePort
  selector:
    app: greetapp-rollout
  ports:
    - name: https
      port: 80
      targetPort: 8080

