apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: greet-api-virtual-service
  namespace: localdevelopment
spec:
  hosts:
    - greet.com
  gateways:
    - istio-system/greet-gw   # <--- points to the gateway you just defined
    - mesh
  http:
    - name: default
      match:
        - uri:
            prefix: /
      route:
        - destination:
            port:
              number: 80
            host: greetapp.localdevelopment.svc.cluster.local
          weight: 100
        - destination:
            port:
              number: 80
            host: greetapp-preview.localdevelopment.svc.cluster.local
          weight: 0
