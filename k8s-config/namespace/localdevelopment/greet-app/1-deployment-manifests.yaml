apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: greetapp-rollout
  namespace: localdevelopment
  labels:
    app: greetapp-rollout
spec:
  revisionHistoryLimit: 1
  replicas: 2
  selector:
    matchLabels:
      app: greetapp-rollout
  template:
    metadata:
      labels:
        app: greetapp-rollout
    spec:
      containers:
        - name: greet-app
          imagePullPolicy: Never 
          resources: {}
          image: greet:v2
          env:
            - name: appVersion
              value: v9
          ports:
            - name: m-pod-metrics
              containerPort: 8080
  strategy:
    canary:
      steps:
        - setWeight: 2
        - pause: {}
        - setWeight: 15
        - pause: {}
        - setWeight: 50
        - pause: {}
      trafficRouting:
        istio:
          virtualServices:
            - name: greet-api-virtual-service
              routes:
                - default
